{{- if not .Values.existingSecret }}
{{- $name := include "costkey.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "costkey.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  COSTKEY_JWT_SECRET: {{ get $data "COSTKEY_JWT_SECRET" | default (randAlphaNum 64 | b64enc) }}
  COSTKEY_NOTIFICATION_ENCRYPTION_KEY: {{ get $data "COSTKEY_NOTIFICATION_ENCRYPTION_KEY" | default (randAlphaNum 64 | b64enc) }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default (randAlphaNum 40 | b64enc) }}
  {{- else }}
  DATABASE_URL: {{ required "Set externalDatabaseUrl, or keep postgres.enabled" .Values.externalDatabaseUrl | b64enc }}
  {{- end }}
{{- end }}
