apiVersion: v1
kind: Service
metadata:
  name: {{ include "costkey.fullname" . }}
  labels: {{- include "costkey.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
